  <text x="400" y="73" fill="#8B949E" font-family="Consolas, monospace" font-size="16" text-anchor="middle">Calculator.exe</text>
  <text x="90" y="140" fill="#10B981" font-family="Consolas, monospace" font-size="22" font-weight="bold">PYTHON CALCULATOR v1.0</text>
